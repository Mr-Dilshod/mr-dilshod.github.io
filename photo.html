<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Send a photo · Ⓓ English</title>
<style>
:root{--navy:#2E1018;--paper:#FAF7F2;--goldtx:#8C2A3E;--line:rgba(74,23,38,.14);--soft:#6E5A5F;--text:#4A1726;--gold:#7FA57B;--gold2:#A9C6A6;--ok:#2F8F5B;--okbg:rgba(47,143,91,.07);--bad:#C2413A;--badbg:rgba(194,65,58,.09);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:500 18px/1.45 'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;overflow-wrap:anywhere}
main{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:9px}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#1D3461,#0F1F3D 70%);box-shadow:inset 0 0 0 1.5px #E7B95B;font:italic 700 19px/1 Georgia,'Times New Roman',serif;color:#E7B95B}
.wm{font:600 22px/1 Georgia,'Times New Roman',serif;color:#13213F}
.eye{font:800 12px/1.3 sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--goldtx);margin:0}
h1{font:800 clamp(24px,7vw,32px)/1.15 Georgia,'Times New Roman',serif;margin:0}
p{margin:0}
.soft{color:var(--soft);font-size:16px}
.mic{display:grid;place-items:center;gap:6px;width:100%;min-height:170px;border:0;border-radius:18px;background:var(--gold2);color:var(--navy);padding:16px;text-align:center;font-weight:800;font-size:20px;line-height:1.3;font-family:inherit;cursor:pointer;touch-action:manipulation}
.mic .ic{font-size:44px;line-height:1}
.mic .tm{font:800 36px/1 Georgia,serif;font-variant-numeric:tabular-nums}
.mic.rec{background:#C2413A;color:#fff}
.mic.wait{background:rgba(74,23,38,.05);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line);cursor:default}
.lv{width:80%;height:10px;border-radius:10px;background:rgba(74,23,38,.18);overflow:hidden}
.lv i{display:block;height:100%;width:0;background:#fff}
.btn{border:0;border-radius:12px;background:var(--gold2);color:var(--navy);font-weight:800;font-size:18px;line-height:1.25;font-family:inherit;padding:13px 18px;min-height:52px;width:100%;cursor:pointer}
.btn.alt{background:rgba(74,23,38,.07);color:var(--text)}
.box{padding:12px 16px;border-radius:12px;font-weight:700}
.ok{background:var(--okbg);border:1px solid var(--ok)}
.bad{background:var(--badbg);border:1px solid var(--bad)}
audio{width:100%}
img.prev{width:100%;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line)}
label.btn{display:flex;align-items:center;justify-content:center;text-align:center}
label.btn input{display:none}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="badge">D</span><span class="wm">English</span></div>
  <div><p class="eye" id="eye">Photo</p><h1 id="title">Send a photo 📷</h1></div>
  <p class="soft" id="who"></p>
  <label class="btn" id="take">📷 Take a photo<input type="file" accept="image/*" capture="environment" id="file"></label>
  <img class="prev" id="prev" alt="Your photo" hidden>
  <p class="box ok" id="sent" hidden></p>
  <label class="btn alt" id="more" hidden>📷 Send another photo<input type="file" accept="image/*" capture="environment" id="file2"></label>
</main>
<script>
/* A small photo page for students who do the lesson on a computer with no camera:
   they scan the code in the lesson with their phone, take the photo here, and it goes to Mr. Dilshod's Drive. */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.hash.slice(1).replace(/\+/g, "%20"));
  var job = { u: q.get("u") || "https://script.google.com/macros/s/AKfycbyceBX4s-Srxgrf7rsL9wPLeO8LRm8Y8YbrxbpnFHAFO1n2C66SuBlRjAnvIL21PlCbQw/exec", l: q.get("l"), n: q.get("n") || "", t: q.get("t") || "Photo" };
  if (!job.l) { $("who").textContent = "Scan the code in your lesson to open this page."; $("take").hidden = true; return; }
  $("eye").textContent = "Lesson " + job.l + " · " + (job.t === "Homework" ? "Homework" : "Photo");
  $("title").textContent = job.t === "Homework" ? "Send your homework 📷" : job.t;
  $("who").textContent = (job.n ? job.n + ", t" : "T") + "ake a clear photo of your work. It goes to Mr. Dilshod.";
  function stamp() { var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + "-" + p(d.getMinutes()) + "-" + p(d.getSeconds()); }
  function safe(s) { return String(s || "").replace(/[\\/:*?"<>|]/g, " ").replace(/[^\p{L}\p{N} .,'-]/gu, "").replace(/\s+/g, " ").trim(); }
  function pick(inp) {
    var f = inp.files[0]; inp.value = ""; if (!f) return;
    var u = URL.createObjectURL(f), im = new Image(), line = $("sent");
    im.onerror = function () { line.hidden = false; line.className = "box bad"; line.textContent = "This picture can't be opened. Try again."; };
    im.onload = function () {
      var k = Math.min(1, 1600 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      var data = c.toDataURL("image/jpeg", .8); $("prev").src = data; $("prev").hidden = false;
      $("take").hidden = true; $("more").hidden = false;
      line.hidden = false; line.className = "box ok"; line.textContent = "Sending to Mr. Dilshod…";
      var body = { kind: "voice", id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), lesson: job.l, name: safe(job.n) || "No name", file: (safe(job.n) || "No name") + " - " + safe(job.t) + " - " + stamp() + ".jpg", mime: "image/jpeg", audio: data.split(",")[1] };
      fetch(job.u, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
        .then(function () { line.textContent = "✓ Sent to Mr. Dilshod. You can close this page."; },
              function () { line.className = "box bad"; line.textContent = "No internet. Connect and take the photo again."; $("take").hidden = false; $("more").hidden = true; });
    };
    im.src = u;
  }
  $("file").onchange = function () { pick(this); };
  $("file2").onchange = function () { pick(this); };
})();
</script>
</body>
</html>
