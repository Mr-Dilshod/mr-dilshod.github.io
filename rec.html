<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Record · Ⓓ English</title>
<style>
:root{--navy:#FFFFFF;--paper:#F5F8FB;--goldtx:#762C85;--line:rgba(var(--ink),.14);--soft:#5A6478;--text:#1F2A44;--gold:#F37C22;--gold2:#0089C2;--ok:#2F8F5B;--okbg:rgba(47,143,91,.07);--bad:#C2413A;--badbg:rgba(194,65,58,.09);--ink:31,42,68;--wm:#13213F;color-scheme:light dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:500 18px/1.45 'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;overflow-wrap:anywhere}
main{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:9px}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#1D3461,#0F1F3D 70%);box-shadow:inset 0 0 0 1.5px #E7B95B;font:italic 700 19px/1 Georgia,'Times New Roman',serif;color:#E7B95B}
.wm{font:600 22px/1 Georgia,'Times New Roman',serif;color:var(--wm)}
.eye{font:800 12px/1.3 sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--goldtx);margin:0}
h1{font:800 clamp(24px,7vw,32px)/1.15 Georgia,'Times New Roman',serif;margin:0}
p{margin:0}
.soft{color:var(--soft);font-size:16px}
.mic{display:grid;place-items:center;gap:6px;width:100%;min-height:170px;border:0;border-radius:18px;background:var(--gold2);color:var(--navy);padding:16px;text-align:center;font-weight:800;font-size:20px;line-height:1.3;font-family:inherit;cursor:pointer;touch-action:manipulation}
.mic .ic{font-size:44px;line-height:1}
.mic .tm{font:800 36px/1 Georgia,serif;font-variant-numeric:tabular-nums}
.mic.rec{background:#C2413A;color:#fff}
.mic.wait{background:rgba(var(--ink),.05);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--line);cursor:default}
.lv{width:80%;height:10px;border-radius:10px;background:rgba(var(--ink),.18);overflow:hidden}
.lv i{display:block;height:100%;width:0;background:#fff}
.btn{border:0;border-radius:12px;background:var(--gold2);color:var(--navy);font-weight:800;font-size:18px;line-height:1.25;font-family:inherit;padding:13px 18px;min-height:52px;width:100%;cursor:pointer}
.btn.alt{background:rgba(var(--ink),.07);color:var(--text)}
.box{padding:12px 16px;border-radius:12px;font-weight:700}
.ok{background:var(--okbg);border:1px solid var(--ok)}
.bad{background:var(--badbg);border:1px solid var(--bad)}
audio{width:100%}
@media (prefers-color-scheme:dark){:root{--paper:#111827;--text:#E8ECF4;--soft:#A3ADC2;--goldtx:#D9A2E8;--gold:#F59A4F;--gold2:#1683BE;--navy:#FFFFFF;--ink:232,236,244;--wm:#F1F4FA;--ok:#5CC98C;--okbg:rgba(92,201,140,.13);--bad:#FF8A7A;--badbg:rgba(255,138,122,.13)}}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="badge">D</span><span class="wm">English</span></div>
  <div><p class="eye" id="eye">Speaking</p><h1 id="title">Record your answer 🎙️</h1></div>
  <p class="soft" id="who"></p>
  <p class="box bad" id="warn" hidden></p>
  <button class="mic" id="mic" type="button"></button>
  <div id="after" hidden style="display:grid;gap:12px">
    <p class="box ok" id="sent">Sending to Mr. Dilshod…</p>
    <audio id="me" controls></audio>
    <button class="btn" id="back" type="button">Back to the lesson</button>
    <button class="btn alt" id="again" type="button">Record again</button>
  </div>
</main>
<script>
/* A small recording page. The lesson file can't use the microphone when it is opened from Telegram,
   so it opens this page: the student records here, the recording goes to Mr. Dilshod's Drive,
   and the lesson is told that the task is done. */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var job = {};
  try { job = JSON.parse(decodeURIComponent(location.hash.slice(1))) || {}; } catch (e) {}
  var seconds = Math.max(20, Math.min(600, +job.s || 60)), need = Math.max(1000, (+job.m || 0) * 1000 || seconds * 50);
  if (job.t) $("title").textContent = job.t;
  if (job.l) $("eye").textContent = "Lesson " + job.l + " · Speaking";
  if (job.n) $("who").textContent = job.n + ", tap the blue button and speak. Tap again when you finish.";
  var mic = $("mic"), warn = $("warn"), mode = "idle", ms = null, mr = null, ac = null, iv = null, chunks = [], heard = 0, left = 0, blob = null, sent = false;
  function fmt(s) { s = Math.max(0, s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function idle(txt) { mode = "idle"; mic.className = "mic"; mic.hidden = false; mic.innerHTML = "<span class='ic'>🎙️</span><span>" + (txt || "Tap here and speak") + "</span><span class='tm'>" + fmt(seconds) + "</span>"; }
  function bad(t) { warn.textContent = t; warn.hidden = false; }
  function cleanup() { clearInterval(iv); iv = null; if (ms) ms.getTracks().forEach(function (x) { x.stop(); }); ms = null; if (ac) { try { ac.close(); } catch (e) {} ac = null; } }
  function start() {
    warn.hidden = true;
    if (!navigator.mediaDevices || !window.MediaRecorder) { bad("This browser can't record. Open the lesson in Google Chrome."); return; }
    mode = "asking"; mic.className = "mic wait"; mic.innerHTML = "<span class='ic'>🎙️</span><span>Press Allow to turn on the microphone</span>";
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      ms = stream; chunks = []; heard = 0; left = seconds * 10;
      var type = ["audio/mp4;codecs=mp4a.40.2", "audio/mp4", "audio/webm;codecs=opus", "audio/webm"].filter(function (x) { return MediaRecorder.isTypeSupported(x); })[0];
      mr = new MediaRecorder(ms, type ? { mimeType: type, audioBitsPerSecond: 32000 } : {});
      mr.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
      mr.onstop = function () { var b = new Blob(chunks, { type: (mr.mimeType || "audio/webm").split(";")[0] }); cleanup(); check(b); };
      var an = null, buf = null, hang = 0;
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.resume) ac.resume(); an = ac.createAnalyser(); an.fftSize = 1024; ac.createMediaStreamSource(ms).connect(an); buf = new Uint8Array(an.fftSize); } catch (e) { an = null; }
      mr.start(); mode = "rec"; mic.className = "mic rec";
      mic.innerHTML = "<span class='ic'>⏹️</span><span class='sl'>Speak now. Keep going…</span><span class='tm'>" + fmt(seconds) + "</span><span class='lv'><i></i></span>";
      var tm = mic.querySelector(".tm"), lv = mic.querySelector(".lv i"), sl = mic.querySelector(".sl");
      iv = setInterval(function () {
        left--; tm.textContent = fmt(Math.ceil(left / 10));
        if (an && ac && ac.state === "running") { an.getByteTimeDomainData(buf); var s = 0; for (var i = 0; i < buf.length; i++) { var v = (buf[i] - 128) / 128; s += v * v; } var rms = Math.sqrt(s / buf.length); lv.style.width = Math.min(100, rms * 500) + "%"; if (rms > .008) hang = 10; if (hang > 0) { hang--; heard += 100; } } else heard += 100;
        if (heard >= need) sl.textContent = "Good! Tap here when you finish.";
        if (left <= 0) stop();
      }, 100);
    }).catch(function () { idle(); bad("The microphone is off. Tap the lock icon next to the address, allow the microphone, then tap the blue button again."); });
  }
  function stop() { if (mode !== "rec") return; mode = "stopping"; clearInterval(iv); try { mr.stop(); } catch (e) { cleanup(); idle(); } }
  var tries = 0;
  function check(b) {
    if (heard < 600 && tries < 1) { tries++; idle(); bad("I can't hear you. Speak louder and try again."); return; }
    if (heard < need && tries < 1) { tries++; idle(); bad("Too short. Say all of it, then tap to stop."); return; }
    blob = b; mic.hidden = true; $("after").hidden = false; $("me").src = URL.createObjectURL(b); send();
  }
  function stampNow() { var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + "-" + p(d.getMinutes()) + "-" + p(d.getSeconds()); }
  function safe(s) { return String(s || "").replace(/[\\/:*?"<>|]/g, " ").replace((function () { try { return new RegExp("[^\\p{L}\\p{N} .,'-]", "gu"); } catch (e) { return /[^A-Za-z0-9\u00C0-\u024F\u02BB\u02BC\u0400-\u04FF .,'-]/g; } })(), "").replace(/\s+/g, " ").trim(); }
  function send() {
    var line = $("sent"); line.className = "box ok"; line.textContent = "Sending to Mr. Dilshod…";
    if (!job.u) { line.textContent = "✓ Recorded"; tell(); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var mime = (blob.type || "audio/webm").split(";")[0], ext = mime.indexOf("mp4") > -1 ? "m4a" : "webm";
      var data = { kind: "voice", id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), lesson: job.l, name: safe(job.n) || "No name", file: safe(job.n) + " - " + safe(job.w || job.t) + " - " + stampNow() + "." + ext, mime: mime, audio: String(fr.result).split(",")[1] };
      fetch(job.u, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(data) })
        .then(function () { sent = true; line.textContent = "✓ Sent to Mr. Dilshod"; tell(); },
              function () { line.className = "box bad"; line.textContent = "No internet. Connect and tap Back to the lesson to send it again."; });
    };
    fr.readAsDataURL(blob);
  }
  function tell() {
    /* tell the lesson that this task is done, give it the recording, and go back */
    try { if (window.opener) window.opener.postMessage({ dee: "rec", id: job.id, blob: blob, sent: sent }, "*"); } catch (e) {}
    setTimeout(goBack, 1500);
  }
  function goBack() {
    try { window.close(); } catch (e) {}
    setTimeout(function () { $("back").textContent = "Done! Switch back to the lesson tab"; }, 400);
  }
  mic.onclick = function () { if (mode === "idle") start(); else if (mode === "rec") stop(); };
  $("back").onclick = function () { if (!sent && job.u) { send(); return; } goBack(); };
  $("again").onclick = function () { $("after").hidden = true; tries = 0; sent = false; idle(); start(); };
  if (!job.id) { $("who").textContent = "Open this page from a lesson."; mic.hidden = true; return; }
  idle();
})();
</script>
</body>
</html>
