name: Update lesson list

on:
  push:
    branches: [main]
    paths:
      - "lesson-*.html"
      - "worksheets.json"
      - "tools/build_lessons.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_lessons.py
      - name: Commit lessons.json if it changed
        run: |
          if git diff --quiet -- lessons.json; then
            echo "No change"
          else
            git config user.name "lesson-list-bot"
            git config user.email "actions@users.noreply.github.com"
            git add lessons.json
            git commit -m "Update lessons.json"
            git push
          fi
